<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin — Upload</title>
  <link rel="stylesheet" href="/src/styles/_variables.css">
  <link rel="stylesheet" href="/src/styles/components/forms.css">
  <style>
    .wrap{ max-width:720px; margin:24px auto }
    .preview{ display:flex; gap:8px; flex-wrap:wrap }
    .thumb{ width:120px;height:80px;object-fit:cover;border-radius:6px }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Image Upload (Demo)</h1>
    <p>This page simulates image uploads by creating blob URLs for preview and suggesting WebP generation steps. Uploaded images are not committed to the repo automatically.</p>
    <div>
      <input id="file" type="file" accept="image/*" multiple>
    </div>
    <div class="preview" id="preview"></div>
    <div style="margin-top:12px">
      <button id="copy-urls" class="btn-primary">Copy image URLs</button>
    </div>
  </main>

  <script src="/src/js/admin-upload.js" defer></script>
</body>
</html>
