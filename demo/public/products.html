<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OptixTweak — Produkte</title>
  <meta name="description" content="Produktübersicht — Filter & Suche Demo">

  <!-- Open Graph -->
  <meta property="og:title" content="OptixTweak — Produkte">
  <meta property="og:description" content="Produktübersicht — Filter & Suche Demo">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://OptixTweak.github.io/public/products.html">
  <meta property="og:image" content="/assets/images/placeholder-1200.webp">

  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#8a5cff">
  <link rel="stylesheet" href="/src/styles/_variables.css">
  <link rel="stylesheet" href="/src/styles/components/card.css">
  <link rel="stylesheet" href="/src/styles/components/buttons.css">
  <style>
    .controls{ display:flex; gap:12px; align-items:center; margin-bottom:16px; }
    .search{ flex:1; }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <div class="brand"><span class="logo">OptixTweak</span></div>
      <nav class="site-nav nav" aria-hidden="true">
        <a href="index.html">Home</a>
        <a href="faq.html">FAQ</a>
        <a href="support.html">Support</a>
      </nav>
      <div class="actions">
        <a class="btn-primary" href="/demo/checkout/cart.html">Warenkorb <span id="cart-count" hidden></span></a>
      </div>
    </header>

    <section>
      <h1>Produkte</h1>
      <div class="controls">
        <input id="search" class="input search" placeholder="Suche Produkte..." aria-label="Suche Produkte">
        <select id="category" class="input" aria-label="Kategorie">
          <option value="">Alle Kategorien</option>
          <option value="ui">UI Packs</option>
          <option value="icons">Icon Sets</option>
        </select>
        <select id="sort" class="input" aria-label="Sortieren">
          <option value="featured">Empfohlen</option>
          <option value="price-asc">Preis aufsteigend</option>
          <option value="price-desc">Preis absteigend</option>
        </select>
      </div>

      <div id="products-grid" class="grid" aria-live="polite"></div>
    </section>

    <footer class="site-footer">
      <div class="cols"><div>© OptixTweak</div><div><a href="impressum.html">Impressum</a></div></div>
    </footer>
  </main>

  <script src="/src/js/nav.js" defer></script>
  <script src="/src/js/products.js" defer></script>
  <script src="/src/js/register-sw.js" defer></script>
</body>
</html>
