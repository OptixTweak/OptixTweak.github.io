<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Register — OptixTweak Demo</title>
  <link rel="stylesheet" href="/src/styles/_variables.css">
  <link rel="stylesheet" href="/src/styles/components/forms.css">
</head>
<body>
  <main class="container" style="max-width:560px; margin: 48px auto;">
    <div style="padding:24px; border-radius:24px; background:linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02)); border:1px solid rgba(255,255,255,0.08);">
      <h1>Registrieren</h1>
      <p style="color:var(--color-muted-text)">Erstellen Sie ein Demo-Konto, um Bestellungen nachzuverfolgen und den Shop zu testen.</p>
      <form id="register-form" aria-label="Registrieren">
        <div class="field"><label for="email">E‑Mail</label><input id="email" name="email" type="email" required class="input"></div>
        <div class="field"><label for="password">Passwort</label><input id="password" name="password" type="password" required class="input"></div>
        <div class="field"><label for="confirm">Passwort bestätigen</label><input id="confirm" name="confirm" type="password" required class="input"></div>
        <div style="margin-top:12px"><button id="register" type="submit" class="btn-primary">Registrieren</button></div>
      </form>

      <h2 style="font-size:1rem; margin-top:24px">Oder über Social</h2>
      <p style="margin:0; color:var(--color-muted-text)">OAuth-Platzhalter — der Flow wird im Demo-Modus simuliert.</p>
      <div style="display:flex;gap:8px;margin-top:8px; flex-wrap:wrap">
        <button id="oauth-google" class="btn-secondary">Continue with Google</button>
        <button id="oauth-github" class="btn-secondary">Continue with GitHub</button>
      </div>

      <p style="margin-top:18px"><a href="login.html">Bereits Account? Login</a></p>
    </div>
  </main>

  <script src="/src/js/auth.js" defer></script>
</body>
</html>
